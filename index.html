<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ishan Jain</title>
    <style>
      :root {
        --bg: #fafafa;
        --fg: #1a1a1a;
        --muted: #666;
        --link: #0b57d0;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #111;
          --fg: #eee;
          --muted: #aaa;
          --link: #8ab4f8;
        }
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font:
          17px/1.6 system-ui,
          -apple-system,
          Segoe UI,
          Roboto,
          sans-serif;
      }
      main {
        max-width: 640px;
        margin: 0 auto;
        padding: 64px 16px;
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 4px;
      }
      .muted {
        color: var(--muted);
        margin-top: 0;
      }
      a {
        color: var(--link);
      }
      h2 {
        font-size: 1.1rem;
        margin-top: 40px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      ul {
        padding-left: 20px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ishan Jain</h1>
      <h2>Links</h2>
      <ul>
        <li><a href="https://github.com/is-jain">GitHub</a></li>
      </ul>
    </main>
  </body>
</html>
